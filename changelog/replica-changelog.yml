description: >-
  Replica publishes product release notes in its Intercom help center rather than an API changelog -
  there is no public API to version. Releases are driven by (a) the seasonal data cadence for Places
  (roughly two seasons per year, released well after the season they model), (b) annual traffic data
  refreshes, and (c) platform/application updates. Entries below are the recent window captured from
  the release-notes article; the live article is the source of truth.
