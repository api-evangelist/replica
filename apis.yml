aid: replica
name: Replica
description: 'Replica is a San Francisco-based data platform for the built environment,
  spun out of Alphabet''s Sidewalk Labs in 2019, that operates a nationwide activity-based
  travel model. Its analytical engine combines public data (US Census/ACS, GTFS transit
  feeds, OpenStreetMap road networks, land-use records, state traffic counts) with
  licensed private data (de-identified aggregate mobile location, credit transaction
  and driving-behavior data) to synthesize a privacy-preserving simulated population
  and a complete trip table for the United States. Products include Places (seasonal,
  high-fidelity activity-based travel model), Trends (weekly near-real-time mobility
  and land-use data), Safety Hub, Safe Streets Planner, and a suite of workflow applications
  used by state DOTs, MPOs, transit agencies, cities and counties. Data is consumed
  through the Replica Studio web platform, CSV export and direct database access;
  Replica publishes documented dataset schemas at documentation.replicahq.com but no
  public developer REST API, SDK or developer portal.'
