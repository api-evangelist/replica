source: https://documentation.replicahq.com/
description: >-
  Replica versions data products, not an API - there is no public developer API to version, deprecate
  or sunset. Versioning is expressed as seasons (Places), weekly refreshes (Trends) and annual
  vintages (traffic/speeds). Deprecation is expressed as dated "[Discontinued]" notices on the
  affected dataset documentation pages. Replica publishes no status page, no SLA, and no formal
  deprecation or versioning policy document.

versioning:
  scheme: seasonal-and-annual-data-vintages
  docs: https://documentation.replicahq.com/docs/seasonal-mobility-model-methodology-extended-places
  cadences:
    - product: Places (seasonal trip table)
      cadence: twice yearly (Spring and Fall seasons)
      evidence: 'Data is released twice a year and is available for download in CSV format.'
      source: https://documentation.replicahq.com/docs/disaggregate-trip-tables
    - product: Trends (daily/weekly mobility data)
      cadence: weekly refresh
      evidence: 'Data is refreshed weekly and can be viewed or exported (CSV).'
      source: https://documentation.replicahq.com/docs/daily-vmt
    - product: Annual traffic datasets (AADT, speeds, hourly volume profiles)
      cadence: annual vintage, keyed to the Fall Places season of the selected year
      source: https://documentation.replicahq.com/docs/annual-average-daily-traffic-aadt
  api_versioning: null
  note: no public API version scheme exists; the private Replica Studio backend uses a /api/v1 path
    prefix but is session-authenticated and undocumented.

