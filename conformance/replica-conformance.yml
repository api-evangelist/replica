description: >-
  Standards and reference data conformance for Replica. Replica is a data provider, not an API
  provider - it publishes no OpenAPI, no OAuth/OIDC surface and no REST error contract, so the usual
  API-protocol conformance rows are recorded as not-applicable. What Replica does conform to are the
  geospatial, transportation and statistical reference standards its datasets are built on and keyed
  to; every row below is evidenced by a specific documentation page.

standards:
  - id: openstreetmap
    name: OpenStreetMap road network
    conforms: true
    evidence: 'Network link functional classifications (freeway, trunk, primary, secondary, tertiary)
      are derived from OpenStreetMap; every link carries an osm_id (OSM Way ID) with a stated OSM
      extract version, and street_name matches the OSM-assigned name.'
    source: https://documentation.replicahq.com/docs/network-links

  - id: gtfs
    name: GTFS (General Transit Feed Specification)
    conforms: true
    evidence: Transit routes and schedules in the transit trip tables are sourced from agency GTFS
      feeds; release notes track the number of transit agencies and GTFS feeds added per season.
    source: https://documentation.replicahq.com/docs/transit

  - id: census-fips
    name: US Census FIPS geographic identifiers
    conforms: true
    evidence: 'geoid fields carry the FIPS code when the geographic feature is a Census geography;
      trip origins and destinations are keyed to Census block groups (bgrp).'
    source: https://documentation.replicahq.com/docs/daily-vmt

  - id: census-acs-pums
    name: US Census ACS / PUMS / CTPP / LEHD inputs
    conforms: true
    evidence: The synthetic population and demographics/employment tables are built from American
      Community Survey, PUMS, CTPP and LEHD inputs.
    source: https://documentation.replicahq.com/docs/seasonal-mobility-model-methodology-extended-places

  - id: naics
    name: NAICS industry classification
    conforms: true
    evidence: Consumer spending transactions were categorized by the merchant's NAICS code (dataset
      family discontinued 2024-12-28).
    source: https://documentation.replicahq.com/docs/weekly-spend-by-merchant-location

  - id: hpms
    name: FHWA HPMS (Highway Performance Monitoring System)
    conforms: true
    evidence: 'Ground-truth AADT values are derived from HPMS data conflated to Replica''s roadway
      network representation; documentation states the most up-to-date HPMS data available is used.'
    source: https://documentation.replicahq.com/docs/annual-average-daily-traffic-aadt

  - id: nhtsa-fars
    name: NHTSA FARS crash data
    conforms: true
    evidence: Crash datasets incorporate NHTSA FARS fatality records.
    source: https://documentation.replicahq.com/docs/crash-data

  - id: wgs84
    name: WGS 84 (EPSG:4326) coordinate reference system
    conforms: true
    evidence: Latitude/longitude fields across the trip and geography tables are documented as WGS 84.
    source: https://documentation.replicahq.com/docs/disaggregate-trip-tables

  - id: h3
    name: Uber H3 hierarchical hexagonal grid
    conforms: true
    evidence: Daily origin-destination pairs and several application datasets are aggregated to H3
      cells of resolution 8.
    source: https://documentation.replicahq.com/docs/daily-o-d-data

  - id: wkt-geojson
    name: WKT / GeoJSON geometry encodings
    conforms: true
    evidence: 'Network-link and intersection geometry fields are published as WKT; several datasets
      are additionally offered as GeoJSON and shapefile exports.'
    source: https://documentation.replicahq.com/docs/free-flow-speed-per-network-link

  - id: privacy-by-design
    name: Published privacy-preserving data principles
    conforms: true
    evidence: 'Replica publishes an "Approach to Privacy" document committing to: procuring only
      de-identified data and never receiving/using/outputting PII; never sharing raw locational data;
      never joining sources on sensitive keys; statistical noise injection defending against membership
      -inclusion and location-inference attacks; and physical/logical separation of sensitive data
      storage. These principles are codified in a Data Protection Addendum in customer agreements.'
    source: https://documentation.replicahq.com/docs/approach-to-privacy

