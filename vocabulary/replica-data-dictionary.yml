- key: disaggregate-trip-tables
  title: Seasonal Trip Table
  status: active
  docs: https://documentation.replicahq.com/docs/disaggregate-trip-tables
  docs_updated: '2025-11-13'
  field_count: 33
  fields:
  - name: activity_id
    content_type: String
    sample_value: '12456839588397874772'
    description: 'A randomly assigned unique identifier defined for each trip. A trip is defined as travel
      between two locations with a discrete purpose at the origin and destination. Some intermediate stops
      with short dwell time may be captured within a single trip. Criteria for this dwell time may vary.
      Examples of trips: • Home > Work, • Work > Gym, • Shop > Eat, • Home > Starbucks drive-thru > Work'
  - name: person_id
    content_type: String
    sample_value: '5666337802154872887'
    description: A randomly assigned unique identifier for each person modeled within the synthetic population.
  - name: household_id
    content_type: String
    sample_value: '12981492413956702344'
    description: A randomly assigned unique identifier for each household modeled within the synthetic
      population.
  - name: mode
    content_type: String
    sample_value: PUBLIC_TRANSIT
    description: 'The primary transportation mode used for the trip. A trip is often made up of multiple
      travel modes, such as a journey to work that includes a walk to a rail station followed by a subway
      ride. In this case two modes were used by the traveler during their trip, walking and public transit.
      Only the primary mode of travel across a set of trip segments is included. The primary mode is determined
      using the following ranking: 1) Public transit, 2) Driving (private auto)/Auto passenger/Taxi/TNC,
      3) Biking, 4) Walking. Valid values are: • BIKING: Trips made by people biking. Replica does not
      model scooter trips and does not separate out e-bike trips • CARPOOL: Trips made by passengers in
      private auto vehicles. Sum Carpool and Private Auto trips to get the total number of people who
      traveled in private autos • COMMERCIAL: Trips made by medium and heavy trucks • ON_DEMAND_AUTO:
      Trips made by passengers in a Taxi or using a Transportation Network Company (TNC) such as Uber
      or Lyft • OTHER_TRAVEL_MODE: Catch-all category for all other trips not assigned any of the modes
      listed herein • PRIVATE_AUTO: Trips made by drivers in private auto vehicles • PUBLIC_TRANSIT: Trips
      that primarily used public transit, such as buses, light rail, and subways • WALKING: Trips made
      by people walking Replica does not explicitly model trips made by school buses. These trips would
      fall under other mode categories, like auto passengers of private auto vehicles, private auto (for
      those old enough to drive), or walking.'
  - name: travel_purpose
    content_type: String
    sample_value: WORK
    description: 'The destination activity assigned to a synthetic person. For example, if a person is
      traveling to work, the purpose of the trip is ''Work,'' whereas if a person is traveling to a restaurant
      the activity is ''Eat.'' Valid values are: • COMMERCIAL: Trips by medium and heavy trucks for deliveries
      and other commercial purposes • EAT: Trips to restaurants • HOME: Trips where the destination is
      the person''s home • LODGING: Trips by visitors to overnight accommodation such as a hotel • MAINTENANCE:
      Trips to hairdressers, auto shops, banks, and a variety of other locations for the purpose of conducting
      errands • OTHER: Catch-all category for all other trips not assigned any of the purposes listed
      herein • RECREATION: Trips to recreational destinations such as parks and swimming pools • REGION_DEPARTURE:
      Trips to a port-of-exit, such as an airport, or freeway crossing. • SCHOOL: Trips to schools such
      as community colleges and universities • SHOP: Trips to stores and other commercial centers • SOCIAL:
      Trips for social activities • STAGE: Trips made by non-residents that start and end outside the
      region • WORK: Trips where the destination is the person''s workplace • WORK FROM HOME: Trips where
      a resident is returning home to work (specifically for residents who are working from home on the
      modeled day). For example, if a person goes out to lunch during the work day, their return trip
      home will be labeled “work_from_home"'
  - name: tour_type
    content_type: String
    sample_value: COMMUTE
    description: 'Indicates what type of tour included this trip. Tours are travel events that start at
      one location and return to that same location. For example, when a person travels to work and returns
      home, it is a home-based work tour. A tour can have two or more trips. Valid values are: • WORK_BASED:
      Tours that started and ended at work, excluding commute e.g. Work > Eat > Work • COMMUTE: Tours
      from home to work and back home including intermediate stops at other destinations e.g. Home > Recreation
      > Work > Shop > Home • OTHER_HOME_BASED: Tours that started and ended at home, excluding commutes
      e.g. Home > Shop > Eat > Home'
  - name: previous_activity_type
    content_type: String
    sample_value: HOME
    description: 'The activity assigned to a synthetic person prior to starting travel. Valid values are:
      • COMMERCIAL: Trips by medium and heavy trucks for deliveries and other commercial purposes • EAT:
      Trips to restaurants • HOME: Trips where the destination is the person''s home • LODGING: Trips
      by visitors to overnight accommodation such as a hotel • MAINTENANCE: Trips to hairdressers, auto
      shops, banks, and a variety of other locations • OTHER: Catch all category for all other trips not
      assigned any of the purposes listed herein • RECREATION: Trips to recreational destinations such
      as parks and swimming pools • REGION_ARRIVAL: Trips to a port-of-entry, such as an airport, or freeway
      crossing • REGION_DEPARTURE: Trips to a port-of-exit, such as an airport, or freeway crossing •
      SCHOOL: Trips to schools such as community colleges and universities • SHOP: Trips to stores and
      other commercial centers • SOCIAL: Trips for social activities • STAGE: Trips made by non-residents
      that start and end outside the region • WORK: Trips where the destination is the person''s workplace'
